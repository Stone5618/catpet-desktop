<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>猫猫档案</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="card">
    <header>
      <span class="title">猫猫档案</span>
      <button id="close" class="icon" title="关闭">×</button>
    </header>

    <div class="level">
      <span id="levelTitle">陌生猫</span>
      <span id="affinity" class="muted">亲密度 0</span>
    </div>
    <div class="bar"><i id="levelBar"></i></div>

    <div class="row">
      <span>心情</span>
      <span id="moodText" class="muted">70 / 100</span>
    </div>
    <div class="bar"><i id="moodBar" class="mood"></i></div>

    <div class="stats">
      <div><b id="todayPetted">0</b><span>今天被摸</span></div>
      <div><b id="todayFed">0</b><span>今天吃鱼</span></div>
      <div><b id="modeText">醒着</b><span>状态</span></div>
    </div>

    <div class="actions">
      <button data-action="pet">摸摸头</button>
      <button data-action="feed">喂小鱼干</button>
      <button data-action="toggle-autostart" id="autostartBtn">开机自启：关</button>
      <button data-action="toggle-passthrough" id="passthroughBtn">自动穿透：开</button>
      <button data-action="hide">藏起来</button>
      <button data-action="quit" class="danger">退出</button>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
