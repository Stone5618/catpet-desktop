<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>bake</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script src="../assets/live2d/lib/L2Dwidget.min.js"></script>
</head>
<body>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var skin = q.get('skin') || 'hijiki';
      var s = Number(q.get('s') || '1');
      var base = '../assets/live2d/' + skin;
      // display 等比放大 s，mscale 固定 1（保持 1x 的模型-显示比例，形状不变）
      L2Dwidget.init({
        model: { jsonPath: base + '/' + skin + '.model.json', scale: 1 },
        display: { position: 'left', width: Math.round(320 * s), height: Math.round(380 * s), hOffset: 0, vOffset: 0 },
        mobile: { show: false, scale: 1 },
        react: { opacityDefault: 1, opacityOnHover: 1 },
        dev: { border: false }
      });
    })();
  </script>
</body>
</html>
